name: Windows caption helper
on:
  push:
    branches: ['feature/**', main]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_acceptance:
        description: Run real CUDA inference on a configured NVIDIA self-hosted runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    needs: [build-test, caption-overlay, speech-integration]
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use a temporary NuGet package directory
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'rayme-nuget'
          "NUGET_PACKAGES=$packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.404'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          vsversion: '2022'
          arch: x64
      - run: npm ci --no-audit --no-fund
      - name: Build pinned CPU/CUDA runtimes and complete portable application
        shell: pwsh
        run: ./distribution/build.ps1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pinned-speech-test-inputs
          path: artifacts/test-inputs
      - name: Verify ZIP and extract into a clean Unicode/spaced directory
        shell: pwsh
        run: |
          $zip = 'artifacts/release/Rayme-Smart-Live-Captions-v1.0.0-win-x64.zip'
          $expected = (Get-Content artifacts/release/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP hash failed' }
          $destination = Join-Path $env:RUNNER_TEMP 'Rayme amis é 日本'
          Expand-Archive $zip $destination
          $package = Join-Path $destination 'Rayme-Smart-Live-Captions'
          "RAYME_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node test/distribution/verify-package.js $package
          if ($LASTEXITCODE -ne 0) { throw 'Package file or native dependency validation failed' }
      - name: Native portable first-run, model/mode controls and clean process lifecycle
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'modèle 日本 CI tiny.en.bin'
          Copy-Item artifacts/test-inputs/ggml-tiny.en.bin $model
          dotnet run --project native/PortablePackage.Tests -c Release -- $env:RAYME_PACKAGE $model
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows acceptance failed' }
      - name: Required real inference through packaged CPU executable and backend
        shell: pwsh
        run: |
          $runtime = @{ server = Join-Path $env:RAYME_PACKAGE 'App/whisper/cpu/whisper-server.exe'; model = (Resolve-Path artifacts/test-inputs/ggml-tiny.en.bin).Path; fixture = (Resolve-Path artifacts/test-inputs/jfk.wav).Path }
          $runtime | ConvertTo-Json | Set-Content artifacts/package-runtime.json
          $env:RAYME_TEST_BACKEND = Join-Path $env:RAYME_PACKAGE 'App/backend'
          node test/audio/speech-e2e.js artifacts/package-runtime.json artifacts/portable-diagnostics/speech.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged real Whisper accuracy/integration failed' }
      - name: Record successful validation for official prerelease publication
        shell: pwsh
        run: |
          @{ commit = $env:GITHUB_SHA; channel = 'prerelease'; packageIntegrity = $true; portableRuntime = $true; packagedRealInference = $true; nativeGuiLifecycle = $true } | ConvertTo-Json | Set-Content artifacts/release/VALIDATION.json
      - name: Defender check where the hosted service is available
        shell: pwsh
        run: |
          $command = Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue
          $status = if ($command) { Get-MpComputerStatus -ErrorAction SilentlyContinue } else { $null }
          if ($status -and $status.AMServiceEnabled -and $status.RealTimeProtectionEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $env:RAYME_PACKAGE -ErrorAction Stop
            $found = Get-MpThreatDetection | Where-Object { ($_.Resources -join ' ') -like "*$env:RAYME_PACKAGE*" }
            if ($found) { throw 'Defender reported a detection in the package; publication is blocked' }
            @{ scanRequested = $true; matchingDetections = 0; guaranteedApproval = $false } | ConvertTo-Json | Set-Content artifacts/release/DEFENDER-STATUS.json
          } else {
            @{ scanRequested = $false; reason = 'Defender service unavailable on hosted runner; no compatibility approval claimed' } | ConvertTo-Json | Set-Content artifacts/release/DEFENDER-STATUS.json
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Rayme-Smart-Live-Captions-win-x64
          compression-level: 0
          path: |
            artifacts/release/Rayme-Smart-Live-Captions-v1.0.0-win-x64.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/PACKAGE-SIZE.json
            artifacts/release/VALIDATION.json
            artifacts/release/DEFENDER-STATUS.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-test-diagnostics
          path: artifacts/portable-diagnostics/
          if-no-files-found: warn
  cuda-hardware:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda_acceptance
    needs: portable
    runs-on: [self-hosted, Windows, X64, rayme-cuda]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Rayme-Smart-Live-Captions-win-x64
          path: acceptance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pinned-speech-test-inputs
          path: acceptance-inputs
      - name: Required actual NVIDIA inference when GPU acceptance is requested
        shell: pwsh
        run: |
          $expected = (Get-Content acceptance/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash acceptance/Rayme-Smart-Live-Captions-v1.0.0-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'GPU acceptance ZIP checksum mismatch' }
          Expand-Archive acceptance/Rayme-Smart-Live-Captions-v1.0.0-win-x64.zip acceptance/extracted
          node test/distribution/gpu-inference.js acceptance/extracted/Rayme-Smart-Live-Captions acceptance-inputs/ggml-tiny.en.bin acceptance-inputs/jfk.wav
          if ($LASTEXITCODE -ne 0) { throw 'Real CUDA evidence or transcription accuracy failed' }
  publish-prerelease:
    needs: [portable, cuda-hardware]
    if: always() && needs.portable.result == 'success' && (needs.cuda-hardware.result == 'success' || needs.cuda-hardware.result == 'skipped') && github.ref == 'refs/heads/feature/windows-loopback-captions' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      gpu_verified: ${{ needs.cuda-hardware.result == 'success' }}
  caption-overlay:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.404'
      - name: Native overlay state, settings and multi-monitor bounds tests
        run: dotnet run --project native/CaptionOverlay.Tests -c Release
      - name: Native authenticated WebSocket session against production server
        run: node test/native-overlay-session.js
      - name: Publish self-contained native overlay
        run: dotnet publish native/CaptionOverlay -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/windows-overlay
      - name: Packaged WPF private handoff and graceful backend shutdown
        run: node test/native-overlay-lifecycle.js artifacts/windows-overlay/CaptionOverlay.exe
      - name: Packaged WPF executable synthetic smoke test (not physical monitor validation)
        shell: pwsh
        env:
          RAYME_UI_SMOKE_OUTPUT: artifacts/overlay-ui
        run: |
          $process = Start-Process ./artifacts/windows-overlay/CaptionOverlay.exe -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Packaged overlay smoke test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged WPF smoke test failed: $($process.ExitCode)" }
          Get-FileHash ./artifacts/windows-overlay/CaptionOverlay.exe -Algorithm SHA256 | Format-List | Out-File artifacts/windows-overlay/SHA256.txt
          Copy-Item PHASE3_REPORT.md artifacts/windows-overlay/
          Copy-Item UI_REFINEMENT_REPORT.md artifacts/windows-overlay/
          Copy-Item WINDOWS-CAPTIONS.md artifacts/windows-overlay/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-caption-overlay-ui-diagnostics
          path: artifacts/overlay-ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-caption-overlay-win-x64
          path: artifacts/windows-overlay/
          if-no-files-found: error
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mock/local-protocol tests (not real audio capture)
        run: npm test
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.404'
      - name: Native conversion and policy tests (no audio endpoint required)
        run: dotnet run --project native/LoopbackCapture.Tests -c Release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: Browser source isolation and controls
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r test/requirements-browser-windows.txt
          python -m playwright install chromium
          python test/overlay-browser.py
      - name: Publish self-contained helper
        run: dotnet publish native/LoopbackCapture -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows-loopback
      - name: Verify executable device enumeration (empty list is valid on CI)
        shell: pwsh
        run: |
          $json = & ./artifacts/windows-loopback/LoopbackCapture.exe --list
          if ($LASTEXITCODE -ne 0) { throw 'Helper failed to enumerate playback devices' }
          $null = $json | ConvertFrom-Json
          $apps = & ./artifacts/windows-loopback/LoopbackCapture.exe --apps
          if ($LASTEXITCODE -ne 0) { throw 'Application discovery failed' }
          $null = $apps | ConvertFrom-Json
          Get-FileHash ./artifacts/windows-loopback/LoopbackCapture.exe -Algorithm SHA256 | Format-List | Out-File artifacts/windows-loopback/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-loopback-win-x64
          path: artifacts/windows-loopback/
          if-no-files-found: error
      - name: Publish controlled test-only audio producer
        run: dotnet publish native/AudioIntegrationProbe -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/audio-test-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-audio-test-tools
          path: artifacts/audio-test-tools/
          if-no-files-found: error
      - name: Fetch/checksum public-domain speech fixture (no model)
        shell: pwsh
        run: ./test/audio/prepare-whisper.ps1 -OutputDirectory artifacts/audio-inputs -FixtureOnly
      - name: Real Windows rendering and process-loopback isolation probe
        run: node test/audio/windows-probe.js artifacts/windows-loopback/LoopbackCapture.exe artifacts/audio-test-tools/AudioIntegrationProbe.exe artifacts/audio-inputs/jfk.wav artifacts/audio-diagnostics/windows.json
      - name: Ensure real-audio result is present even after setup failure
        if: always()
        run: node test/audio/ensure-result.js artifacts/audio-diagnostics/windows.json "Windows rendering/process-loopback probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-audio-diagnostics
          path: artifacts/audio-diagnostics/
          if-no-files-found: error
  speech-integration:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: PowerShell to CMake argument regression
        shell: pwsh
        run: ./test/audio/cmake-arguments.test.ps1
      - name: Prepare pinned CPU Whisper and CI-only tiny.en (required)
        shell: pwsh
        run: ./test/audio/prepare-whisper.ps1
      - name: Real speech end-to-end through production modules (no WASAPI needed)
        run: node test/audio/speech-e2e.js artifacts/ci-whisper/runtime.json artifacts/audio-diagnostics/speech.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-speech-test-inputs
          path: |
            artifacts/ci-whisper/ggml-tiny.en.bin
            artifacts/ci-whisper/jfk.wav
          if-no-files-found: error
      - name: Ensure speech result is present even after setup failure
        if: always()
        run: node test/audio/ensure-result.js artifacts/audio-diagnostics/speech.json "Real Whisper speech pipeline"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speech-integration-diagnostics
          path: artifacts/audio-diagnostics/
          if-no-files-found: error
