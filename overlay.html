<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Captions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:   #1e1f22;
    --bg-main:   #313338;
    --bg-panel:  #2b2d31;
    --bg-hover:  #3a3d44;
    --border:    #3f4147;
    --text:      #f2f3f5;
    --text-dim:  #b5bac1;
    --text-mute: #80848e;
    --green:     #23a55a;
    --blurple:   #5865f2;
    --red:       #f23f43;
    --avatar:    26px;
    --fs:        14px;
    --gap:       4px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg-main);
    color: var(--text);
    font-family: "Poppins", "Segoe UI", sans-serif;
  }
  body { display: flex; flex-direction: column; }

  #bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 400;
    color: var(--text-mute);
  }
  #bar .spacer { flex: 1; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex: none; }
  #dot.on { background: var(--green); }

  .btn {
    background: var(--bg-panel);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:hover { background: var(--bg-hover); color: var(--text); }
  .btn.primary { background: var(--blurple); border-color: var(--blurple); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }

  #stage {
    flex: 1;
    min-height: 0;
    padding: var(--gap);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    overflow: hidden;
  }

  /* one tight row per person */
  .speaker {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    background: var(--bg-panel);
    border-radius: 6px;
    padding: 4px 7px;
    min-height: 0;
    overflow: hidden;
    transition: background .18s, opacity .35s;
  }
  .speaker.talking { background: var(--bg-hover); }

  .pfp-wrap {
    flex: none;
    position: relative;
    width: var(--avatar);
    height: var(--avatar);
    margin-top: 1px;
  }
  .pfp {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--bg-deep);
  }
  .pfp.letter {
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    font-size: calc(var(--avatar) * .46);
    color: #fff;
  }
  .ring {
    position: absolute; inset: -2px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color .15s;
    pointer-events: none;
  }
  .speaker.talking .ring { border-color: var(--green); }

  /* THE KEY PART: name and all speech live in ONE flowing paragraph */
  .para {
    flex: 1;
    min-width: 0;
    font-size: var(--fs);
    line-height: 1.35;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .nm {
    font-weight: 600;
    margin-right: 2px;
  }
  .nm::after { content: ":"; color: var(--text-mute); }

  /* creator */
  .nm.gold {
    color: #ffd24a !important;
    font-weight: 600;
    text-shadow: 0 0 6px rgba(255, 196, 0, .55), 0 0 14px rgba(255, 170, 0, .3);
    animation: shimmer 2.8s ease-in-out infinite;
  }
  .nm.gold::after { color: #c9a227; }
  @keyframes shimmer {
    0%, 100% { text-shadow: 0 0 6px rgba(255,196,0,.5), 0 0 14px rgba(255,170,0,.25); }
    50%      { text-shadow: 0 0 10px rgba(255,214,80,.85), 0 0 22px rgba(255,180,0,.45); }
  }
  .speaker.creator { border: 1px solid rgba(255, 196, 0, .28); }
  .speaker.creator .ring { border-color: rgba(255, 196, 0, .35); }
  .speaker.creator.talking .ring {
    border-color: #ffd24a;
    box-shadow: 0 0 8px rgba(255, 196, 0, .6);
  }

  /* older speech dims but stays on the same flowing line */
  .seg { color: var(--text); }
  .seg.o1 { color: var(--text-dim); }
  .seg.o2 { color: var(--text-mute); }
  .seg.o3 { color: var(--text-mute); opacity: .55; }

  .caret {
    display: inline-block;
    width: 2px; height: .9em;
    background: var(--green);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  #empty {
    margin: auto;
    text-align: center;
    color: var(--text-mute);
    font-size: 12px;
  }

  #settings {
    flex: none;
    display: none;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 5px 8px;
    background: var(--bg-deep);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-mute);
  }
  #settings.open { display: flex; }
  #settings label { display: flex; align-items: center; gap: 4px; }
  #settings input[type=range] { width: 70px; accent-color: var(--blurple); }
</style>
</head>
<body>

<div id="bar">
  <span id="dot"></span>
  <span id="status">Connecting…</span>
  <span class="spacer"></span>
  <button class="btn" id="gear">⚙</button>
  <button class="btn primary" id="pop">Pop out ⧉</button>
</div>

<div id="stage"><div id="empty">Waiting for voice…</div></div>

<div id="settings">
  <label>Text <input type="range" id="fs" min="11" max="22" step="1" value="14"></label>
  <label>Pfp <input type="range" id="av" min="0" max="44" step="2" value="26"></label>
  <label>History <input type="range" id="hist" min="0.4" max="2.5" step="0.1" value="1"></label>
  <button class="btn" id="clear">Clear</button>
</div>

<script>
const stage    = document.getElementById('stage');
const statusEl = document.getElementById('status');
const dot      = document.getElementById('dot');
const emptyEl  = document.getElementById('empty');

const speakers = new Map();
const colors   = new Map();
const palette  = ['#5865f2','#23a55a','#f0b232','#eb459e','#00a8fc','#f23f43','#a855f7','#12b886'];
let colorIdx = 0;
let histMult = 1;

const SPEAK_TIMEOUT = 1300;
const ROW_TIMEOUT   = 90000;

// Built this thing — gets the gold nameplate.
const CREATOR_ID = '273888434148474880';

function colorFor(id) {
  if (!colors.has(id)) colors.set(id, palette[colorIdx++ % palette.length]);
  return colors.get(id);
}

// Space is tight: the more people talking, the fewer characters each keeps.
function charBudget(n) {
  const base = n <= 1 ? 420 : n === 2 ? 260 : n === 3 ? 170 : n === 4 ? 115 : 80;
  return Math.round(base * histMult);
}

// Trim oldest segments until the person fits their budget, then re-shade
// so the newest text is brightest and older text recedes.
function reflow(s) {
  const budget = charBudget(speakers.size);
  let total = s.segs.reduce((a, el) => a + el.textContent.length, 0);

  while (s.segs.length > 1 && total > budget) {
    const gone = s.segs.shift();
    total -= gone.textContent.length;
    gone.remove();
  }

  const n = s.segs.length;
  s.segs.forEach((el, i) => {
    el.className = 'seg';
    const age = n - 1 - i;
    if (age === 1) el.classList.add('o1');
    else if (age === 2) el.classList.add('o2');
    else if (age >= 3) el.classList.add('o3');
  });
}

function letterAvatar(name, id) {
  const d = document.createElement('div');
  d.className = 'pfp letter';
  d.style.background = colorFor(id);
  d.textContent = (name || '?').trim().charAt(0).toUpperCase();
  return d;
}

function createSpeaker(id, name, avatarUrl) {
  const isCreator = String(id) === CREATOR_ID;

  const el = document.createElement('div');
  el.className = 'speaker' + (isCreator ? ' creator' : '');

  const wrap = document.createElement('div');
  wrap.className = 'pfp-wrap';

  let pfp;
  if (avatarUrl) {
    pfp = document.createElement('img');
    pfp.className = 'pfp';
    pfp.src = avatarUrl;
    pfp.alt = '';
    pfp.onerror = () => pfp.replaceWith(letterAvatar(name, id));
  } else {
    pfp = letterAvatar(name, id);
  }
  const ring = document.createElement('div');
  ring.className = 'ring';
  wrap.append(pfp, ring);

  // Name and speech share ONE paragraph so text flows inline and wraps
  // naturally instead of starting a new line per utterance.
  const para = document.createElement('div');
  para.className = 'para';

  const nm = document.createElement('span');
  nm.className = 'nm' + (isCreator ? ' gold' : '');
  nm.textContent = name;
  if (!isCreator) nm.style.color = colorFor(id);
  para.appendChild(nm);

  el.append(wrap, para);
  stage.appendChild(el);

  return { el, para, segs: [], liveEl: null, wrap };
}

function getSpeaker(id, name, avatarUrl) {
  let s = speakers.get(id);
  if (!s) {
    emptyEl.style.display = 'none';
    s = createSpeaker(id, name, avatarUrl);
    speakers.set(id, s);
    for (const other of speakers.values()) reflow(other);
  }
  return s;
}

function markTalking(s) {
  s.el.classList.add('talking');
  clearTimeout(s.speakTimer);
  s.speakTimer = setTimeout(() => s.el.classList.remove('talking'), SPEAK_TIMEOUT);
}

function touchRow(id, s) {
  clearTimeout(s.rowTimer);
  s.rowTimer = setTimeout(() => {
    s.el.style.opacity = '0';
    setTimeout(() => {
      s.el.remove();
      speakers.delete(id);
      for (const other of speakers.values()) reflow(other);
      if (speakers.size === 0) emptyEl.style.display = '';
    }, 360);
  }, ROW_TIMEOUT);
}

function removeSpeaker(id) {
  const s = speakers.get(id);
  if (!s) return;
  clearTimeout(s.rowTimer);
  clearTimeout(s.speakTimer);
  s.el.remove();
  speakers.delete(id);
  for (const other of speakers.values()) reflow(other);
  if (speakers.size === 0) emptyEl.style.display = '';
}

function handle({ type, speaker, speakerId, text, final, avatar }) {
  if (type === 'remove') return removeSpeaker(speakerId);
  if (!text) return;
  const s = getSpeaker(speakerId, speaker, avatar);
  markTalking(s);
  touchRow(speakerId, s);

  if (!s.liveEl) {
    s.liveEl = document.createElement('span');
    s.liveEl.className = 'seg';
    s.para.append(' ', s.liveEl);
    s.segs.push(s.liveEl);
  }

  s.liveEl.textContent = text;

  // caret rides at the end of the live segment
  s.para.querySelectorAll('.caret').forEach(c => c.remove());
  if (!final) {
    const caret = document.createElement('span');
    caret.className = 'caret';
    s.liveEl.after(caret);
  } else {
    s.liveEl = null;
  }

  reflow(s);
}

function connect() {
  const ws = new WebSocket('ws://localhost:8080');
  ws.onopen  = () => { statusEl.textContent = 'Listening'; dot.classList.add('on'); };
  ws.onclose = () => {
    statusEl.textContent = 'Reconnecting…';
    dot.classList.remove('on');
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch {} };
}
connect();

const root = document.documentElement;
document.getElementById('gear').onclick = () =>
  document.getElementById('settings').classList.toggle('open');
document.getElementById('fs').oninput = (e) =>
  root.style.setProperty('--fs', e.target.value + 'px');
document.getElementById('av').oninput = (e) => {
  const v = Number(e.target.value);
  root.style.setProperty('--avatar', v + 'px');
  for (const s of speakers.values()) s.wrap.style.display = v === 0 ? 'none' : '';
};
document.getElementById('hist').oninput = (e) => {
  histMult = Number(e.target.value);
  for (const s of speakers.values()) reflow(s);
};
document.getElementById('clear').onclick = () => {
  for (const s of speakers.values()) { clearTimeout(s.rowTimer); s.el.remove(); }
  speakers.clear();
  emptyEl.style.display = '';
};

// --- floating always-on-top window -------------------------------------
const popBtn = document.getElementById('pop');
if (!('documentPictureInPicture' in window)) {
  popBtn.textContent = 'Chrome/Edge only';
  popBtn.disabled = true;
}
popBtn.onclick = async () => {
  try {
    const pip = await documentPictureInPicture.requestWindow({ width: 460, height: 260 });
    // Poppins must be loaded inside the new window too.
    const link = pip.document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap';
    pip.document.head.appendChild(link);

    for (const sheet of document.styleSheets) {
      try {
        const css = [...sheet.cssRules].map(r => r.cssText).join('');
        const style = pip.document.createElement('style');
        style.textContent = css;
        pip.document.head.appendChild(style);
      } catch {}
    }
    pip.document.body.style.cssText =
      'margin:0;height:100%;background:#313338;display:flex;flex-direction:column;font-family:Poppins,sans-serif';
    pip.document.body.append(stage);
    popBtn.textContent = 'Popped out';
    popBtn.disabled = true;
    pip.addEventListener('pagehide', () => {
      document.body.insertBefore(stage, document.getElementById('settings'));
      popBtn.textContent = 'Pop out ⧉';
      popBtn.disabled = false;
    });
  } catch (err) {
    alert('Could not open floating window: ' + err.message);
  }
};
</script>
</body>
</html>
