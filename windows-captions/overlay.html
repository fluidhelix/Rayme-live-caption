<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows Live Captions</title>
<style>
:root{color-scheme:dark;--fs:24px}*{box-sizing:border-box}body{margin:0;background:#141414;color:#f2f3f5;font-family:'Segoe UI',sans-serif}header{position:sticky;top:0;background:#101010;padding:12px;border-bottom:1px solid #707070}label,button,select{font:inherit}select{max-width:50vw}button,select{background:#222222;color:#f2f3f5;border:1px solid #80848e;border-radius:4px;padding:5px}#status{margin-bottom:10px;color:#ffdf80}main{padding:12px;font-size:var(--fs);line-height:1.5}p{background:#222222;padding:10px;margin:6px 0;overflow-wrap:anywhere}#partial{border-left:4px solid #707070;color:#E3E3E3}#empty{color:#b5bac1}input{vertical-align:middle}details{margin-top:8px}
</style>
<header><div id="status" role="status">Connecting…</div>
<div id="controls"><div><label><input type="checkbox" id="enable-a"> Application A</label> <select id="app-a" aria-label="Application A"></select></div>
<div><label><input type="checkbox" id="enable-b"> Application B</label> <select id="app-b" aria-label="Application B"></select></div>
<div><label><input type="checkbox" id="enable-device"> Whole-device fallback</label> <select id="devices" aria-label="Playback output"></select></div></div>
<button id="refresh">Refresh applications/devices</button> <button id="pause">Pause capture</button>
<details><summary>Caption settings</summary><label>Text size <input id="font" type="range" min="16" max="48" value="24"></label> <button id="clear">Clear history everywhere</button><p>Enable up to two applications OR a playback device. Browser labels identify processes, not tabs. Nothing is recorded. Move/resize this window normally.</p></details></header>
<main aria-label="Caption history"><div id="source-status" role="status"></div><div id="history"></div><div id="partials"></div><p id="partial" hidden></p><p id="empty">Waiting for conversation…</p></main>
<script>
/*RAYME_HISTORY_POLICY*/
const historyEl=document.getElementById('history'),partial=document.getElementById('partial'),statusEl=document.getElementById('status'),devices=document.getElementById('devices'),empty=document.getElementById('empty');
let entries=[],partials={},sources={},apps=[],outputs=[],socket,paused=false,follow=true,deviceDefault='default';
class SegmentLedger {
  constructor(){this.floor=0;this.finalized=0;this.latest=0;this.entries=new Map();}
  revision(id,value){return Number.isSafeInteger(value)&&value>=0?value:(this.entries.get(id)?.revision||0)+1;}
  allows(id,revision,final=false,snapshot=false){
    if(!Number.isSafeInteger(id)||id<=this.floor||!final&&(id<=this.finalized||id<this.latest))return false;
    const old=this.entries.get(id);if(!old)return true;if(old.closed)return false;
    return final?revision>=old.revision:revision>old.revision||snapshot&&revision===old.revision&&!old.cleared;
  }
  mark(id,revision,{closed=false,cleared=false,final=false}={}){
    const old=this.entries.get(id);if(id<=this.floor||old&&(old.closed||!closed&&old.revision>revision))return;
    this.latest=Math.max(this.latest,id);this.entries.set(id,{id,revision:Math.max(revision,old?.revision||0),closed,cleared});if(final||closed)this.finalized=Math.max(this.finalized,id);
    while(this.entries.size>128){const first=Math.min(...this.entries.keys());this.entries.delete(first);this.floor=Math.max(this.floor,first);}
  }
  toJSON(){return{floor:this.floor,finalized:this.finalized,latest:this.latest,entries:[...this.entries.values()]};}
}
const books=new Map();let epochs={};
function book(e){const k=key(e);if(!books.has(k))books.set(k,new SegmentLedger());return books.get(k);}
window.addEventListener('scroll',()=>{follow=innerHeight+scrollY>=document.body.scrollHeight-80;});
function key(e){return (e.source?.id||'legacy')+':'+(e.source?.generation||0);}
function row(e){const p=document.createElement('p');const label=document.createElement('strong');label.textContent=e.source?.name||'Playback output';p.append(label,document.createElement('br'),document.createTextNode(e.text));p.dataset.source=e.source?.id||'legacy';if(e.unfinished){p.dataset.unfinished='true';p.title='Unfinished recognition retained for reading; not a verified final.';const note=document.createElement('small');note.textContent=' · Unfinished';label.append(note);}if(e.queueAgeMs!==undefined){const info=document.createElement('small');info.style.display='block';info.textContent='Inference '+e.inferenceMs+' ms · queue '+e.queueAgeMs+' ms';p.append(info);}return p;}
function render(){historyEl.replaceChildren(...entries.map(row));document.getElementById('partials').replaceChildren(...Object.values(partials).filter(e=>e.text).map(e=>{const p=row(e);p.style.borderLeft='4px solid #707070';p.dataset.partial='true';return p;}));document.getElementById('source-status').replaceChildren(...Object.values(sources).map(e=>{const d=document.createElement('div');d.textContent=e.source.name+' — '+e.state+': '+e.message;return d;}));empty.hidden=entries.length>0||Object.values(partials).some(e=>e.text);if(follow)window.scrollTo(0,document.body.scrollHeight);}
function send(e){if(socket?.readyState===1)socket.send(JSON.stringify(e));}
function controls(supported){
 for(const slot of ['a','b']){const select=document.getElementById('app-'+slot),current=sources[slot]?.source.identity,previous=select.value;select.replaceChildren(new Option('Select application',''),...apps.map(a=>new Option(a.name+' (PID '+a.pid+')',a.id)));if(current&&!apps.some(a=>a.id===current))select.add(new Option('Selected process unavailable — refresh/reselect',current));select.value=current||previous;const enable=document.getElementById('enable-'+slot);enable.checked=!!sources[slot];if(supported!==undefined){select.disabled=!supported;enable.disabled=!supported;}}
 const previous=devices.value;devices.replaceChildren(new Option('Windows default output','default'),...outputs.map(d=>new Option(d.name,d.id)));devices.value=sources.device?.source.identity||previous||deviceDefault;document.getElementById('enable-device').checked=!!sources.device;document.getElementById('pause').textContent=paused?'Resume capture':'Pause capture';
}
function handle(e){
 if(e.type==='snapshot'){
  entries=RaymeHistory.trim(e.history||[]);partials={};sources=e.sources||{};epochs=e.epochs||Object.fromEntries(Object.entries(sources).map(([id,s])=>[id,{source:s.source,removed:false}]));books.clear();
  for(const [slot,data]of Object.entries(e.segments||{})){const l=book({source:slot==='legacy'?null:{id:slot,generation:data.generation}});l.floor=data.floor;l.finalized=data.finalized;l.latest=data.latest||data.finalized;l.entries=new Map(data.entries.map(v=>[v.id,v]));}
  if(!e.segments)for(const item of entries)if(item.final)book(item).mark(item.id,0,{closed:true,cleared:true,final:true});
  for(const item of [...Object.values(e.partials||{}),...(e.partial?[e.partial]:[])]){const l=book(item),revision=l.revision(item.id,item.revision),stamp=epochs[item.source?.id];if(stamp&&(stamp.removed||stamp.source.generation!==item.source.generation||stamp.source.identity!==item.source.identity))continue;if(l.allows(item.id,revision,false,true)&&item.text){partials[item.source?.id||'legacy']={...item,revision};l.mark(item.id,revision);}}
  apps=e.apps||[];outputs=e.devices;deviceDefault=e.selected||'default';paused=e.paused;statusEl.textContent=e.status;controls(e.processSupported);render();return;
 }
 if(e.source){const slot=e.source.id,stamp=epochs[slot];if(stamp&&(stamp.source.generation>e.source.generation||stamp.source.generation===e.source.generation&&stamp.source.identity!==e.source.identity||stamp.removed&&stamp.source.generation>=e.source.generation))return;
  if(!stamp||stamp.source.generation<e.source.generation){if(stamp?.source.identity===e.source.identity&&partials[slot])entries=RaymeHistory.replace(entries,{...partials[slot],final:false,unfinished:true});delete partials[slot];for(const k of books.keys())if(k.startsWith(slot+':'))books.delete(k);if(stamp&&stamp.source.identity!==e.source.identity){entries=entries.filter(c=>c.source?.id!==slot);delete sources[slot];}}
  epochs[slot]={source:e.source,removed:e.type==='source-removed'};
 }
 if(e.type==='status')statusEl.textContent=e.message;
 if(e.type==='devices'){outputs=e.devices;deviceDefault=e.selected||deviceDefault;controls();}
 if(e.type==='applications'){apps=e.apps;controls(e.supported);if(!e.supported)statusEl.textContent='Application loopback unsupported on this OS. Use whole-device fallback.';}
 if(e.type==='source-status'||e.type==='reset'){
  const slot=e.source?.id||'legacy';
  if(e.type==='reset'){const old=partials[slot];if(old)book(old).mark(old.id,old.revision,{closed:true,cleared:true});delete partials[slot];}
  if(e.source){const old=sources[slot];sources[slot]=e.type==='reset'?{...old,source:e.source,state:old?.state||'waiting',message:old?.message||'Waiting for audio'}:e;controls();}render();
 }
 if(e.type==='source-removed'){delete sources[e.source.id];delete partials[e.source.id];entries=entries.filter(c=>c.source?.id!==e.source.id);controls();render();}
 if(e.type==='paused'){paused=e.paused;controls();}
 if(e.type==='cleared'){entries=[];partials={};render();}
 if(e.type==='segment-retired'){
  const slot=e.source?.id||'legacy',l=book(e),revision=l.revision(e.id,e.revision),terminal=e.terminal!==false;l.mark(e.id,revision,{closed:terminal,cleared:true});const p=partials[slot];if(p&&(p.id<e.id||p.id===e.id&&(terminal||p.revision<=revision))){if(e.retain===true)entries=RaymeHistory.replace(entries,{...p,final:false,unfinished:true});delete partials[slot];}if(terminal&&e.retain!==true)entries=entries.filter(c=>!c.unfinished||RaymeHistory.key(c)!==RaymeHistory.key(e));render();
 }
 if(e.type==='caption'){
  const l=book(e),slot=e.source?.id||'legacy',revision=l.revision(e.id,e.revision);if(!l.allows(e.id,revision,e.final))return;e={...e,revision};
  if(!e.text?.trim()){l.mark(e.id,revision,{closed:!!e.final,cleared:true});const p=partials[slot];if(p&&(p.id<e.id||p.id===e.id&&p.revision<=revision))delete partials[slot];}
  else{const previous=partials[slot];if(previous&&previous.id<e.id)entries=RaymeHistory.replace(entries,{...previous,final:false,unfinished:true});l.mark(e.id,revision,{closed:!!e.final,cleared:!!e.final,final:!!e.final});if(e.final){if(partials[slot]?.id<=e.id)delete partials[slot];entries=RaymeHistory.replace(entries,e);}else if(!partials[slot]||partials[slot].id<=e.id){entries=entries.filter(c=>RaymeHistory.key(c)!==RaymeHistory.key(e));partials[slot]=e;}}
  render();
 }
}

function connect(){socket=new WebSocket(location.origin.replace('http:','ws:')+'/?token='+new URLSearchParams(location.search).get('token'));socket.onmessage=e=>{try{handle(JSON.parse(e.data));}catch{}};socket.onclose=()=>{statusEl.textContent='Connection lost. Reconnecting…';setTimeout(connect,1500);};socket.onerror=()=>socket.close();}
for(const slot of ['a','b','device']){const select=slot==='device'?devices:document.getElementById('app-'+slot),enable=document.getElementById('enable-'+slot);const configure=()=>{if(enable.checked&&!select.value){enable.checked=false;return;}send({type:'configure',slot,id:select.value,enabled:enable.checked});};enable.onchange=configure;select.onchange=()=>{if(enable.checked)configure();};}
document.getElementById('refresh').onclick=()=>send({type:'refresh'});document.getElementById('pause').onclick=()=>send({type:'pause',paused:!paused});document.getElementById('font').oninput=e=>document.documentElement.style.setProperty('--fs',e.target.value+'px');document.getElementById('clear').onclick=()=>send({type:'clear'});connect();
</script></html>
